name: Build SmartGuard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'smartguard/**'
      - '.github/workflows/smartguard_build_apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartguard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Ensure Android project scaffold exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name smartguard
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartguard-release-apk
          path: smartguard/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
